apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sample-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/bhonepyaehmuee/CircleCI.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true