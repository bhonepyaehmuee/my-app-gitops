apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: default
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-config-server
          image: bownoed/api-gateway:a1aa4a59545d142cc6c3efbb665b70ff37cc22c7
          command:
            - sh
            - -c
            - "until (echo > /dev/tcp/config-server/8888) 2>/dev/null; do echo waiting for config-server; sleep 2; done;"
    # spec:
    #   initContainers:
    #   - name: wait-for-config-server
    #   image: bownoed/eureka-server:a1aa4a59545d142cc6c3efbb665b70ff37cc22c7
    #   command:
    #     - sh
    #     - -c
    #     - "until (echo > /dev/tcp/config-server/8888) 2>/dev/null; do echo waiting for config-server; sleep 2; done;"
      # initContainers:
      #   - name: wait-for-config-server
      #     image: bownoed/api-gateway:a1aa4a59545d142cc6c3efbb665b70ff37cc22c7
      #     command: ['sh', '-c', 'until curl -s http://config-server:8888/actuator/health; do echo waiting for config-server; sleep 2; done;']
          # command: ['sh', '-c', 'until nc -z -w 2 config-server 8888; do echo waiting for config-server; sleep 2; done;']
      containers:
        - name: api-gateway
          image: bownoed/api-gateway:a1aa4a59545d142cc6c3efbb665b70ff37cc22c7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: default
  labels:
    app: api-gateway
spec:
  type: NodePort

  selector:
    app: api-gateway

  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
