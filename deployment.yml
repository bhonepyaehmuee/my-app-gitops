apiVersion: apps/v1
kind: Deployment

metadata:
  name: helloworld-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: helloworld

  template:
    metadata:
      labels:
        app: helloworld

    spec:
      containers:
        - name: helloworld
          image: bownoed/sample-api:451ce1de72da6bbd23dfbb507f476a00838e8edd
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
